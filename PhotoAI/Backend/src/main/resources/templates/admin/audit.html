<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="admin/layout :: head('作品审核')"></head>
<body>
<div class="admin-app">
    <aside th:replace="admin/layout :: sidebar('review')"></aside>
    <div class="admin-main">
        <div th:replace="admin/layout :: topbar('作品审核', 'PhotoAI 管理台 / 内容 / 作品审核')"></div>
        <div class="admin-body">
            <p th:replace="admin/layout :: feedback"></p>

            <div class="bulk-bar" id="bulkBar" hidden>
                <b id="bulkCount">已选 0 件</b>
                <span class="hint">批量操作逐件提交，失败项会在下方单独列出</span>
                <div class="spacer"></div>
                <button type="button" class="btn small primary" data-write id="bulkApprove">批量通过</button>
                <button type="button" class="btn small danger" data-write id="bulkReject">批量驳回</button>
                <button type="button" class="btn small ghost" id="bulkClear">取消选择</button>
            </div>

            <div class="review-layout">
                <div class="panel queue-panel">
                    <div class="panel-head">
                        <h2>待审核队列</h2>
                        <span class="sub" id="queueTotal">—</span>
                        <div class="spacer"></div>
                        <select class="field" id="pageSize" aria-label="每页条数">
                            <option value="10">每页 10</option>
                            <option value="20">每页 20</option>
                            <option value="50">每页 50</option>
                        </select>
                    </div>
                    <div class="queue" id="queue" aria-live="polite">
                        <div class="empty">正在加载…</div>
                    </div>
                    <div class="pager" id="queuePager">
                        <button type="button" class="pg" id="prevPage" disabled>‹</button>
                        <span id="pageInfo">—</span>
                        <button type="button" class="pg" id="nextPage" disabled>›</button>
                    </div>
                </div>

                <div class="panel detail-panel" id="detailPanel">
                    <div class="hero" id="detailHero">
                        <div class="hero-empty">从左侧选择一件作品查看大图</div>
                    </div>
                    <div class="detail-body" id="detailBody">
                        <p class="empty">尚未选择作品</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<style>
    .bulk-bar {
        display: flex;
        align-items: center;
        gap: 12px;
        background: #FFF8F3;
        border: 1px solid #FFE0CE;
        border-radius: 11px;
        padding: 10px 14px;
        margin-bottom: 14px;
        font-size: 12px;
        color: var(--warn);
    }
    .bulk-bar[hidden] { display: none; }
    .bulk-bar .hint { color: var(--ink2); }
    .bulk-bar .spacer { flex: 1; }
    .bulk-bar .btn.primary { color: #fff; }
    .bulk-bar .btn.danger { color: var(--bad); }

    .review-layout { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 16px; align-items: start; }
    .queue-panel { display: flex; flex-direction: column; max-height: 720px; }
    .queue { padding: 8px; overflow-y: auto; flex: 1 1 auto; }
    .queue-item {
        display: flex;
        gap: 10px;
        padding: 9px;
        border-radius: 10px;
        cursor: pointer;
        border: 1px solid transparent;
        align-items: flex-start;
    }
    .queue-item:hover { background: #FCF7F4; }
    .queue-item.active { background: var(--brand-soft); border-color: #FFD9C6; }
    .queue-item img { width: 62px; height: 62px; border-radius: 9px; object-fit: cover; flex: 0 0 62px; background: #EEE; }
    .queue-item .t { font-size: 12px; font-weight: 600; margin-bottom: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .queue-item .m { font-size: 10.5px; color: var(--ink3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .queue-item .m b { color: var(--ink2); font-weight: 500; }
    .queue-item input { margin-top: 2px; }

    .detail-panel { overflow: hidden; }
    .detail-panel .hero { height: 340px; background: #1C1714; display: flex; align-items: center; justify-content: center; position: relative; }
    .detail-panel .hero img { width: 100%; height: 100%; object-fit: contain; }
    .hero-empty { color: #8C7F76; font-size: 12px; }
    .detail-body { padding: 18px; }
    .detail-body h3 { margin: 0 0 6px; font-size: 17px; }
    .detail-body .desc { color: var(--ink2); font-size: 12.5px; line-height: 1.65; margin: 10px 0 16px; white-space: pre-wrap; }
    .exif-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
    .exif-grid div { background: #FCFAF9; border: 1px solid #F3EEEA; border-radius: 9px; padding: 9px 11px; }
    .exif-grid span { display: block; font-size: 10px; color: var(--ink3); margin-bottom: 3px; }
    .exif-grid b { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .detail-actions { display: flex; gap: 10px; align-items: center; padding-top: 16px; border-top: 1px solid var(--line); flex-wrap: wrap; }
    .detail-actions .hint { font-size: 11px; color: var(--ink3); margin-left: auto; max-width: 34ch; line-height: 1.5; }
    .meta-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .meta-row .muted { font-size: 11px; color: var(--ink3); }
    .author-line { display: flex; align-items: center; gap: 9px; margin-top: 10px; }
    .author-line img { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; background: #EEE; }
    .reject-box { margin-top: 12px; padding: 12px; background: #FCFAF9; border: 1px solid #F3EEEA; border-radius: 10px; }
    .reject-box textarea {
        width: 100%;
        min-height: 84px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 9px 11px;
        font-family: inherit;
        font-size: 12.5px;
        resize: vertical;
    }
    .reject-box .err { color: var(--bad); font-size: 11.5px; min-height: 18px; margin: 6px 0 0; }
</style>
<script th:src="@{/static/admin/admin-review.js(v=20261106b)}"></script>
</body>
</html>
