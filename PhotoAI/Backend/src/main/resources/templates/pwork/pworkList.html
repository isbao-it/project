<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="admin/layout :: head('作品管理')"></head>
<body class="page-fill">
<div class="admin-app">
    <aside th:replace="admin/layout :: sidebar('works')"></aside>
    <div class="admin-main">
        <div th:replace="admin/layout :: topbar('作品管理', 'PhotoAI 管理台 / 内容 / 作品管理')"></div>
        <div class="admin-body">
            <p th:replace="admin/layout :: feedback"></p>

            <div class="panel">
                <div class="panel-head">
                    <div class="seg" id="statusSeg" role="tablist" aria-label="按状态筛选">
                        <button type="button" class="active" data-status="">全部 <span class="c" id="cAll">–</span></button>
                        <button type="button" data-status="展示">展示 <span class="c" id="cVisible">–</span></button>
                        <button type="button" data-status="待审核">待审核 <span class="c" id="cPending">–</span></button>
                        <button type="button" data-status="隐藏">隐藏 <span class="c" id="cHidden">–</span></button>
                        <button type="button" data-status="已驳回">已驳回 <span class="c" id="cRejected">–</span></button>
                    </div>
                    <div class="spacer"></div>
                    <span class="sub" id="worksTotal">—</span>
                </div>

                <div class="filter-row">
                    <input class="field" id="keyword" style="width:230px" placeholder="搜索标题 / 作者 / 作品 ID" autocomplete="off">
                    <select class="field" id="category" aria-label="分类">
                        <option value="">全部分类</option>
                    </select>
                    <button type="button" class="btn primary" id="searchBtn">查询</button>
                    <button type="button" class="btn" id="resetBtn">重置</button>
                    <button type="button" class="btn" id="addCategoryBtn" title="新增作品分类">+ 新增分类</button>
                </div>

                <div class="table-scroll">
                <table class="data-table">
                    <caption class="sr-only">作品列表</caption>
                    <thead>
                    <tr>
                        <th style="width:78px">图片</th>
                        <th>作品</th>
                        <th>作者</th>
                        <th>分类</th>
                        <th>状态</th>
                        <th>提交时间</th>
                        <th style="width:200px">操作</th>
                    </tr>
                    </thead>
                    <tbody id="workRows">
                    <tr><td colspan="7" class="empty">正在加载…</td></tr>
                    </tbody>
                </table>
                </div>
                <div class="pager">
                    <span id="worksPageInfo">—</span>
                    <div class="spacer"></div>
                    <button type="button" class="pg" id="worksPrev" disabled>‹</button>
                    <span id="worksPageNum">1</span>
                    <button type="button" class="pg" id="worksNext" disabled>›</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal-mask" id="categoryMask" hidden>
    <div class="modal-box narrow" role="dialog" aria-modal="true" aria-label="新增分类">
        <div class="modal-head">
            <h3>新增分类</h3>
            <button type="button" class="btn small ghost" id="categoryClose">关闭</button>
        </div>
        <div class="modal-body">
            <label class="field-label" for="newCategoryName">分类名称</label>
            <input class="field" id="newCategoryName" maxlength="20" placeholder="1-20 个字，如「人像摄影」" autocomplete="off">
            <p class="hint" id="categoryTip">新增后立即出现在筛选下拉与作品发布页；分类名不可重复。</p>
        </div>
        <div class="modal-foot">
            <button type="button" class="btn" id="categoryCancel">取消</button>
            <button type="button" class="btn primary" id="categorySave">保存</button>
        </div>
    </div>
</div>

<div class="modal-mask" id="detailMask" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-label="作品详情">
        <div class="modal-head">
            <h3 id="modalTitle">作品详情</h3>
            <button type="button" class="btn small ghost" id="modalClose">关闭</button>
        </div>
        <div class="modal-hero" id="modalHero"></div>
        <div class="modal-body" id="modalBody"></div>
    </div>
</div>

<style>
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .modal-mask {
        position: fixed;
        inset: 0;
        background: rgba(26, 20, 16, .45);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 40;
    }
    .modal-mask[hidden] { display: none; }
    .modal-box {
        width: min(860px, calc(100vw - 80px));
        max-height: calc(100vh - 80px);
        background: #fff;
        border-radius: 14px;
        overflow: auto;
        box-shadow: 0 20px 60px rgba(0, 0, 0, .25);
    }
    .modal-head {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 18px;
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: 0;
        background: #fff;
        z-index: 1;
    }
    .modal-head h3 { margin: 0; font-size: 14px; }
    .modal-head .btn { margin-left: auto; }
    .modal-hero { height: 320px; background: #1C1714; display: flex; align-items: center; justify-content: center; }
    .modal-hero img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .modal-hero .empty { color: #8C7F76; }
    .modal-body { padding: 16px 18px 20px; }
    .modal-body .desc { color: var(--ink2); font-size: 12.5px; line-height: 1.65; white-space: pre-wrap; margin: 8px 0 14px; }
    .modal-body .exif-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .modal-body .exif-grid div { background: #FCFAF9; border: 1px solid #F3EEEA; border-radius: 9px; padding: 9px 11px; }
    .modal-body .exif-grid span { display: block; font-size: 10px; color: var(--ink3); margin-bottom: 3px; }
    .modal-body .exif-grid b { font-size: 12px; }
    /* 新增分类弹层：内容少，收窄宽度；底部按钮右对齐 */
    .modal-box.narrow { max-width: 420px; }
    .modal-body .field-label { display: block; font-size: 12px; color: var(--ink2); margin-bottom: 6px; }
    .modal-body .hint { font-size: 11.5px; color: var(--ink3); line-height: 1.6; margin: 9px 0 0; }
    .modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 0 18px 18px; }
</style>
<script th:src="@{/static/admin/admin-works.js(v=20261106c)}"></script>
</body>
</html>
