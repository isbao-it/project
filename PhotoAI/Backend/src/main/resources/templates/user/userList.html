<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="admin/layout :: head('用户管理')"></head>
<body class="page-fill">
<div class="admin-app">
    <aside th:replace="admin/layout :: sidebar('users')"></aside>
    <div class="admin-main">
        <div th:replace="admin/layout :: topbar('用户管理', 'PhotoAI 管理台 / 账号 / 用户管理')"></div>
        <div class="admin-body">
            <p th:replace="admin/layout :: feedback"></p>

            <div class="notice">
                <span aria-hidden="true">ℹ</span>
                <div>不能禁用/删除自己；最后一个正常管理员受保护；删除有作品的用户会<b>连带删除其作品与评论、点赞、收藏、关注</b>，点击前会先告知波及件数。</div>
            </div>

            <div class="panel">
                <div class="filter-row">
                    <input class="field" id="keyword" style="width:230px" placeholder="搜索昵称 / 用户名" autocomplete="off">
                    <button type="button" class="btn primary" id="searchBtn">查询</button>
                    <button type="button" class="btn" id="resetBtn">重置</button>
                    <div class="spacer"></div>
                    <span class="sub" id="userTotal">—</span>
                </div>

                <div class="table-scroll">
                <table class="data-table">
                    <caption class="sr-only">用户列表</caption>
                    <thead>
                    <tr>
                        <th>用户</th>
                        <th style="width:110px">UID</th>
                        <th style="width:90px">角色</th>
                        <th style="width:80px">状态</th>
                        <th style="width:130px">手机号</th>
                        <th style="width:120px">注册时间</th>
                        <th style="width:240px">操作</th>
                    </tr>
                    </thead>
                    <tbody id="userRows">
                    <tr><td colspan="7" class="empty">正在加载…</td></tr>
                    </tbody>
                </table>
                </div>
                <div class="pager">
                    <span id="usersPageInfo">—</span>
                    <div class="spacer"></div>
                    <button type="button" class="pg" id="usersPrev" disabled>‹</button>
                    <span id="usersPageNum">1</span>
                    <button type="button" class="pg" id="usersNext" disabled>›</button>
                </div>
            </div>
        </div>
    </div>
</div>
<style>
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .guard-loading { font-size: 10.5px; color: var(--ink3); }
</style>
<script th:src="@{/static/admin/admin-users.js(v=20261106b)}"></script>
</body>
</html>
