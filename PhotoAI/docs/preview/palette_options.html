<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; margin: 0; padding: 20px; background: #fafafa; color: #111; }
  h2 { font-size: 15px; margin: 0 0 14px; font-weight: 600; letter-spacing: .5px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; }
  .scheme { border-radius: 14px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .head { padding: 10px 14px; font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
  .head small { font-weight: 400; opacity: .75; font-size: 11px; }
  .body { padding: 14px; }
  .swatches { display: flex; gap: 6px; margin-bottom: 12px; }
  .sw { width: 34px; height: 34px; border-radius: 8px; }
  .card { border-radius: 10px; overflow: hidden; margin-bottom: 8px; }
  .thumb { height: 74px; display: flex; align-items: flex-end; padding: 6px; }
  .thumb .tag { font-size: 9px; color: #fff; background: rgba(0,0,0,.42); padding: 2px 6px; border-radius: 5px; }
  .meta { padding: 8px 10px; }
  .title { font-size: 12px; font-weight: 600; margin-bottom: 6px; }
  .row { display: flex; align-items: center; gap: 6px; font-size: 10px; }
  .ava { width: 16px; height: 16px; border-radius: 50%; }
  .acts { display: flex; gap: 10px; font-size: 10px; margin-top: 8px; padding-top: 8px; }
  .btn { margin-top: 10px; text-align: center; font-size: 11px; padding: 7px; border-radius: 8px; font-weight: 600; }
</style>
</head>
<body>
<h2>配色方案预览（下划线处为各自的品牌色）</h2>
<div class="grid">

  <!-- A 靛蓝紫 -->
  <div class="scheme" style="background:#FFFFFF">
    <div class="head" style="background:#5B5BD6;color:#fff">A · 靛蓝紫 <small>改动最小</small></div>
    <div class="body">
      <div class="swatches">
        <div class="sw" style="background:#5B5BD6"></div>
        <div class="sw" style="background:#EEEEFB"></div>
        <div class="sw" style="background:#8B5CF6"></div>
        <div class="sw" style="background:#F7F7FA;border:1px solid #E8E8F0"></div>
      </div>
      <div class="card" style="background:#F7F7FA">
        <div class="thumb" style="background:linear-gradient(135deg,#8B9DC3,#4A5A7A)"><span class="tag">夜景</span></div>
        <div class="meta">
          <div class="title" style="color:#18191C">码头清晨</div>
          <div class="row"><div class="ava" style="background:#5B5BD6"></div><span style="color:#61666D">苏禾</span></div>
          <div class="acts" style="color:#9499A0"><span>♡ 168</span><span>1129</span></div>
        </div>
      </div>
      <div class="btn" style="background:#5B5BD6;color:#fff">发布作品</div>
    </div>
  </div>

  <!-- B 青碧 -->
  <div class="scheme" style="background:#FFFFFF">
    <div class="head" style="background:#0EA5A5;color:#fff">B · 青碧 <small>清爽自然</small></div>
    <div class="body">
      <div class="swatches">
        <div class="sw" style="background:#0EA5A5"></div>
        <div class="sw" style="background:#E6F7F6"></div>
        <div class="sw" style="background:#06B6D4"></div>
        <div class="sw" style="background:#F7F9F9;border:1px solid #E6EAEA"></div>
      </div>
      <div class="card" style="background:#F7F9F9">
        <div class="thumb" style="background:linear-gradient(135deg,#7FB3A8,#2F5A52)"><span class="tag">风光</span></div>
        <div class="meta">
          <div class="title" style="color:#18191C">码头清晨</div>
          <div class="row"><div class="ava" style="background:#0EA5A5"></div><span style="color:#61666D">苏禾</span></div>
          <div class="acts" style="color:#9499A0"><span>♡ 168</span><span>1129</span></div>
        </div>
      </div>
      <div class="btn" style="background:#0EA5A5;color:#fff">发布作品</div>
    </div>
  </div>

  <!-- C 暖橙 -->
  <div class="scheme" style="background:#FFFFFF">
    <div class="head" style="background:#FF6B35;color:#fff">C · 暖橙 <small>照片暖调协调</small></div>
    <div class="body">
      <div class="swatches">
        <div class="sw" style="background:#FF6B35"></div>
        <div class="sw" style="background:#FFF0EA"></div>
        <div class="sw" style="background:#FFB020"></div>
        <div class="sw" style="background:#FAF8F7;border:1px solid #EDE8E5"></div>
      </div>
      <div class="card" style="background:#FAF8F7">
        <div class="thumb" style="background:linear-gradient(135deg,#E8A87C,#7A4433)"><span class="tag">街拍</span></div>
        <div class="meta">
          <div class="title" style="color:#18191C">码头清晨</div>
          <div class="row"><div class="ava" style="background:#FF6B35"></div><span style="color:#61666D">苏禾</span></div>
          <div class="acts" style="color:#9499A0"><span>♡ 168</span><span>1129</span></div>
        </div>
      </div>
      <div class="btn" style="background:#FF6B35;color:#fff">发布作品</div>
    </div>
  </div>

  <!-- D 深色专业 -->
  <div class="scheme" style="background:#0E0E10">
    <div class="head" style="background:#1A1A1D;color:#fff">D · 深色专业 <small>改动最大</small></div>
    <div class="body">
      <div class="swatches">
        <div class="sw" style="background:#FF7A45"></div>
        <div class="sw" style="background:#2A1A14"></div>
        <div class="sw" style="background:#E8C36A"></div>
        <div class="sw" style="background:#1A1A1D;border:1px solid #2E2E33"></div>
      </div>
      <div class="card" style="background:#1A1A1D">
        <div class="thumb" style="background:linear-gradient(135deg,#5A6B8C,#141821)"><span class="tag">夜景</span></div>
        <div class="meta">
          <div class="title" style="color:#F2F2F5">码头清晨</div>
          <div class="row"><div class="ava" style="background:#FF7A45"></div><span style="color:#A0A0A8">苏禾</span></div>
          <div class="acts" style="color:#6E6E76"><span>♡ 168</span><span>1129</span></div>
        </div>
      </div>
      <div class="btn" style="background:#FF7A45;color:#fff">发布作品</div>
    </div>
  </div>

</div>
</body>
</html>
