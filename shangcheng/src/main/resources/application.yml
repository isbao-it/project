server:
  port: 8082

spring:
  jackson:
    ## ��ʽΪyyyy-MM-dd HH:mm:ss
    date-format: yyyy-MM-dd
    ## ��ʱ�������8Сʱ��ʱ�������
    time-zone: GMT+8
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB
    main.allow-circular-references: true

  devtools:
    restart:
      #??????
      enabled: true
      #???????????
      additional-paths: src/main/java
      #???????????
      exclude: test/**
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    url: ${DB_URL:jdbc:mysql://localhost:3306/db_pg?serverTimezone=Asia/Shanghai}
    # url: jdbc:mysql://DB_libary?serverTimezone=GMT%2B8&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  mvc:
    static-path-pattern: /static/**
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    encoding: utf-8
    servlet:
      content-type: text/html
    mode: HTML5

mybatis-plus:
  global-config:
    db-config:
      id-type: auto
      field-strategy: not_empty
      #???????????
      column-underline: true
      #??????????
      logic-delete-value: 0
      logic-not-delete-value: 1
      db-type: mysql
    refresh: false
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:/mapper/*.xml

pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql