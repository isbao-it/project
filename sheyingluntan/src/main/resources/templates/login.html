<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>登录</title>
    <link rel="stylesheet" th:href="@{/static/lib/layui-v2.5.5/css/layui.css}">
</head>
<body style="background: #f0f2f5;">
<div style="width: 400px; margin: 100px auto; background: white; padding: 30px; border-radius: 8px;">
    <h2 style="text-align:center;">摄影作品交流平台</h2>
    <form class="layui-form" lay-filter="loginForm">
        <div class="layui-form-item">
            <label class="layui-form-label">手机号</label>
            <div class="layui-input-block">
                <input type="text" name="pnum" lay-verify="required|phone" placeholder="请输入手机号" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">密码</label>
            <div class="layui-input-block">
                <input type="password" name="pwd" lay-verify="required" placeholder="请输入密码" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-input-block">
                <button class="layui-btn layui-btn-primary" lay-submit lay-filter="login">登录</button>
            </div>
        </div>
    </form>
</div>
<script th:src="@{/static/lib/layui-v2.5.5/layui.js}"></script>
<script>
    layui.use(['form', 'layer'], function() {
        var $ = layui.jquery, form = layui.form, layer = layui.layer;

        // 检查 URL 参数，显示未登录提示
        var urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('msg') === 'unauthorized') {
            layer.msg('未登录，请先登录', {icon: 0, time: 2000});
        }

        form.on('submit(login)', function(data) {
            $.post('/user/login', data.field, function(res) {
                if (res.code === 200) {
                    localStorage.setItem('token', res.data.token);
                    localStorage.setItem('role', res.data.role);
                    localStorage.setItem('uname', res.data.uname);
                    localStorage.setItem('uid', res.data.uid);
                    // 同时存 Cookie，让浏览器页面跳转也能带上 token
                    document.cookie = 'token=' + res.data.token + '; path=/; max-age=86400';
                    if (res.data.role === '管理员') {
                        location.href = '/page/admin/index';
                    } else {
                        location.href = '/page/user/index';
                    }
                } else {
                    layer.msg(res.msg, {icon: 2});
                }
            }).fail(function() { layer.msg('服务器错误', {icon: 2}); });
            return false;
        });
    });
</script>
</body>
</html>
