<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:include="common::title('摄影作品列表')"></head>
<body>
<div class="layuimini-container">
    <div class="layuimini-main">
        <fieldset class="table-search-fieldset">
            <legend>搜索信息</legend>
            <div style="margin: 10px;">
                <div class="layui-form-item">
                    <div class="layui-inline layui-form-pane">
                        <label class="layui-form-label">作品标题</label>
                        <div class="layui-input-inline">
                            <input autocomplete="off" class="layui-input" id="wtitle" name="wtitle" placeholder="请输入标题关键字">
                        </div>
                    </div>
                    <div class="layui-inline layui-form-pane">
                        <label class="layui-form-label">作品描述</label>
                        <div class="layui-input-inline">
                            <input autocomplete="off" class="layui-input" id="wdesc" name="wdesc" placeholder="请输入描述关键字">
                        </div>
                    </div>
                    <div class="layui-inline layui-form-pane">
                        <label class="layui-form-label" style="width: 90px">作品状态</label>
                        <div class="layui-input-inline" style="width: 120px">
                            <select id="wstatus" name="wstatus" class="layui-input">
                                <option value="">全部</option>
                                <option value="展示">展示</option>
                                <option value="隐藏">隐藏</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline">
                        <button class="layui-btn layui-btn-normal" id="searchBtn" lay-submit><i class="layui-icon"></i> 搜 索</button>
                    </div>
                </div>
            </div>
        </fieldset>

        <table class="layui-hide" id="currentTableId" lay-filter="currentTableFilter">
            <script type="text/html" id="rowToolbarTpl">
                <a class="layui-btn layui-btn-normal layui-btn-xs" lay-event="detail">详情</a>
            </script>
        </table>
    </div>
</div>

<script charset="utf-8" th:src="@{/static/lib/layui-v2.5.5/layui.js}"></script>
<script th:inline="none">
    layui.use(['form', 'table', 'layer'], function () {
        var $ = layui.jquery,
            form = layui.form,
            layer = layui.layer,
            table = layui.table;

        table.render({
            elem: '#currentTableId',
            url: '/pwork/list',
            request: { pageName: 'pageNum', limitName: 'pageSize' },
            limits: [6, 12, 20, 50],
            limit: 6,
            page: true,
            parseData: function(res) {
                return {
                    code: res.code === 200 ? 0 : 1,
                    msg: res.msg,
                    count: res.total,
                    data: res.data
                };
            },
            defaultToolbar: ['filter', 'exports', 'print'],
            where: {
                // 管理员看全部，普通用户只看自己的作品
                uid: (localStorage.getItem('role') === '管理员') ? '' : (localStorage.getItem('uid') || '')
            },
            cols: [[
                {field: 'pid', width: 200, title: '作品ID', align: 'center'},
                {field: 'wtitle', width: 200, title: '作品标题', align: 'center'},
                {field: 'wdesc', width: 250, title: '作品描述', align: 'center'},
                {field: 'viewcount', width: 100, title: '浏览量', align: 'center'},
                {field: 'votecount', width: 100, title: '投票数', align: 'center'},
                {field: 'likep', width: 100, title: '点赞数', align: 'center'},
                {field: 'wstatus', width: 100, title: '状态', align: 'center', templet: function(d) {
                        return d.wstatus === '展示' ? '<span style="color:green;">展示</span>' : '<span style="color:gray;">隐藏</span>';
                    }},
                {field: 'cwtime', width: 170, title: '创建时间', align: 'center', templet: function(d) {
                        return d.cwtime || '';
                    }},
                {fixed: 'right', width: 100, align: 'center', title: '操作', toolbar: '#rowToolbarTpl'}
            ]],
            id: 'pworkTable'
        });

        // 普通用户搜索时也要保留 uid 过滤
        var baseUid = (localStorage.getItem('role') === '管理员') ? '' : (localStorage.getItem('uid') || '');

        $('#searchBtn').on('click', function () {
            table.reload('pworkTable', {
                where: {
                    uid: baseUid,
                    wtitle: $('#wtitle').val(),
                    wdesc: $('#wdesc').val(),
                    wstatus: $('#wstatus').val()
                },
                page: {curr: 1}
            });
        });

        table.on('tool(currentTableFilter)', function (obj) {
            var data = obj.data;
            if (obj.event === 'detail') {
                $.get('/pwork/' + data.pid, function(res) {
                    if (res.code === 200 && res.data) {
                        var p = res.data;
                        var html = '<div style="padding:20px;line-height:1.8;">' +
                            '<div style="text-align:center; margin-bottom:15px;">' +
                            '<img src="' + (p.vurl || '/static/images/default.jpg') + '" style="max-width:100%;max-height:200px;" onerror="this.src=\'/static/images/default.jpg\'">' +
                            '</div>' +
                            '<p><strong>作品ID：</strong>' + (p.pid || '') + '</p>' +
                            '<p><strong>作品标题：</strong>' + (p.wtitle || '') + '</p>' +
                            '<p><strong>作品描述：</strong>' + (p.wdesc || '') + '</p>' +
                            '<p><strong>浏览量：</strong>' + (p.viewcount || '0') + '</p>' +
                            '<p><strong>投票数：</strong>' + (p.votecount || '0') + '</p>' +
                            '<p><strong>点赞数：</strong>' + (p.likep || '0') + '</p>' +
                            '<p><strong>状态：</strong>' + (p.wstatus === '展示' ? '<span style="color:green;">展示</span>' : '<span style="color:gray;">隐藏</span>') + '</p>' +
                            '<p><strong>创建时间：</strong>' + (p.cwtime || '') + '</p>' +
                            '</div>';
                        layer.open({
                            title: '作品详情 - ' + p.wtitle,
                            type: 1,
                            area: ['600px', '500px'],
                            content: html,
                            btn: ['关闭']
                        });
                    } else {
                        layer.msg(res.msg || '获取详情失败', {icon: 2});
                    }
                }).fail(function() {
                    layer.msg('请求失败，请检查网络', {icon: 2});
                });
            }
        });
    });
</script>
</body>
</html>
