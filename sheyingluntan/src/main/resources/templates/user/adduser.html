<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:include="common::title('新增用户')"></head>
<style>
    .layui-table-body tr:hover td {
        background-color: #126da0 !important;
        color: white !important;
    }
    .avatar-preview {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        object-fit: cover;
        margin-top: 10px;
        border: 1px solid #ddd;
    }
</style>
<body>
<div class="layuimini-container">
    <div class="layuimini-main">
        <fieldset class="table-search-fieldset">
            <legend>新增用户信息</legend>
            <div style="margin: 20px;">
                <form id="addUserForm" class="layui-form">
                    <div class="layui-form-item">
                        <label class="layui-form-label">用户名<font color="red">*</font></label>
                        <div class="layui-input-block">
                            <input type="text" name="uname" lay-verify="required" placeholder="请输入用户名" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">手机号<font color="red">*</font></label>
                        <div class="layui-input-block">
                            <input type="text" name="pnum" lay-verify="required|phone" placeholder="请输入手机号" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">密码<font color="red">*</font></label>
                        <div class="layui-input-block">
                            <input type="password" name="pwd" lay-verify="required" placeholder="请输入密码" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">角色</label>
                        <div class="layui-input-block">
                            <select name="role" lay-verify="required">
                                <option value="普通用户" selected>普通用户</option>
                                <option value="管理员">管理员</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">积分</label>
                        <div class="layui-input-block">
                            <input type="number" name="vote" value="0" min="0" max="9999" step="1" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">头像上传</label>
                        <div class="layui-input-block">
                            <button type="button" class="layui-btn layui-btn-primary" id="uploadAvatarBtn">
                                <i class="layui-icon"></i> 上传头像
                            </button>
                            <input type="hidden" name="avatar" id="avatarUrl">
                            <div id="avatarPreview"></div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="layui-input-block">
                            <button type="button" class="layui-btn layui-btn-normal" id="submitAddBtn">立即提交</button>
                        </div>
                    </div>
                </form>
            </div>
        </fieldset>
    </div>
</div>

<script charset="utf-8" th:src="@{/static/lib/layui-v2.5.5/layui.js}"></script>
<script>
    layui.use(['form', 'layer', 'upload'], function () {
        var $ = layui.jquery,
            form = layui.form,
            layer = layui.layer,
            upload = layui.upload;

        // 头像上传
        var uploadInst = upload.render({
            elem: '#uploadAvatarBtn',
            url: '/upload/avatar',
            accept: 'images',
            size: 2048, // 限制2MB
            done: function(res) {
                console.log('上传响应:', res);
                if (res.code === 200) {
                    var url = res.data;
                    console.log('返回的URL:', url);
                    $('#avatarUrl').val(url);
                    $('#avatarPreview').html('<img src="' + url + '" class="avatar-preview" onerror="this.onerror=null;this.src=\'/static/images/avatar/admin.jpg\';">');
                    layer.msg('上传成功', {icon: 1});
                } else {
                    layer.msg(res.msg || '上传失败', {icon: 2});
                }
            },
            error: function() {
                layer.msg('上传失败，请重试', {icon: 2});
            }
        });

        // 提交表单（原有逻辑不变，仅增加头像URL）
        $('#submitAddBtn').on('click', function () {
            var uname = $('input[name="uname"]').val();
            var pnum = $('input[name="pnum"]').val();
            var pwd = $('input[name="pwd"]').val();
            var role = $('select[name="role"]').val();
            var vote = $('input[name="vote"]').val();
            var avatar = $('#avatarUrl').val();  // 获取上传后的头像URL

            if (!uname) { layer.msg('用户名不能为空', {icon: 2}); return; }
            if (!pnum) { layer.msg('手机号不能为空', {icon: 2}); return; }
            if (!pwd) { layer.msg('密码不能为空', {icon: 2}); return; }
            if (!/^1[3-9]\d{9}$/.test(pnum)) { layer.msg('手机号格式不正确', {icon: 2}); return; }

            var voteNum = parseInt(vote);
            if (isNaN(voteNum) || voteNum < 0 || voteNum > 9999) {
                layer.msg('积分必须在 0 到 9999 之间', {icon: 2});
                return;
            }

            var formData = {
                uname: uname,
                pnum: pnum,
                pwd: pwd,
                role: role,
                vote: voteNum.toString(),
                avatar: avatar || '/static/images/avatar/admin.jpg'
            };

            $.ajax({
                url: '/user/add',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(formData),
                success: function(res) {
                    if (res.code === 200) {
                        layer.msg('添加成功', {icon: 1, time: 1000}, function() {
                            var index = parent.layer.getFrameIndex(window.name);
                            parent.layer.close(index);
                            parent.location.reload();
                        });
                    } else {
                        layer.msg(res.msg || '添加失败', {icon: 2});
                    }
                },
                error: function() {
                    layer.msg('服务器错误', {icon: 2});
                }
            });
        });
    });
</script>
</body>
</html>
